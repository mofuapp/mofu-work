<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#B8956A">
<title>もふぱう お仕事記録</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="icon" href="icon-192.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F5F0EA;--card:#fff;--cream:#FFF9F2;
  --brown:#B8956A;--brown-soft:#E8DDD0;--brown-pale:#F3EBE0;
  --sage:#A8C5A0;--sage-light:#E4F0E0;--sage-pale:#F0F7EE;
  --pink:#E8B4B8;--pink-light:#FCE8EA;
  --yellow:#F5D88A;--yellow-soft:#FFF5D6;
  --ink:#4A4035;--ink-soft:#8A7E72;--ink-light:#B8AFA5;
  --radius:22px;--nav-h:76px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --font:'M PLUS Rounded 1c',-apple-system,sans-serif;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--ink);overflow:hidden}
body{display:flex;flex-direction:column}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 92% 8%,rgba(232,180,184,.25) 0%,transparent 35%),
    radial-gradient(circle at 8% 92%,rgba(168,197,160,.2) 0%,transparent 35%),
    radial-gradient(circle at 50% 40%,rgba(245,216,138,.12) 0%,transparent 50%);
}

.screen{display:none;flex:1;flex-direction:column;overflow:hidden;padding-top:var(--safe-top);position:relative;z-index:1}
.screen.active{display:flex}
.scroll-body{flex:1;overflow-y:auto;padding:0 16px calc(var(--nav-h) + var(--safe-bottom) + 16px);-webkit-overflow-scrolling:touch}

/* ===== TIMER ===== */
.timer-header{padding:20px 20px 0;text-align:center}
.timer-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card);border:2px solid var(--brown-soft);
  padding:5px 14px;border-radius:999px;font-size:12px;font-weight:700;color:var(--brown);
}
.timer-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.timer-display{
  font-size:64px;font-weight:300;letter-spacing:.06em;
  color:var(--ink);margin:20px 0 8px;font-variant-numeric:tabular-nums;
  line-height:1;
}
.timer-display.running{color:var(--brown)}
.timer-hint{font-size:12px;color:var(--ink-light);font-weight:500;margin-bottom:20px}

.timer-hero{
  margin:0 16px 24px;padding:24px 20px 28px;
  background:var(--card);border-radius:var(--radius);
  border:2.5px solid var(--brown-soft);
  box-shadow:0 6px 0 rgba(184,149,106,.12);
  text-align:center;position:relative;overflow:visible;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.timer-hero::before,.timer-hero::after{
  content:'';position:absolute;width:40px;height:40px;
  border-radius:50%;opacity:.35;
}
.timer-hero::before{background:var(--sage-light);top:-12px;right:-8px}
.timer-hero::after{background:var(--pink-light);bottom:-10px;left:-8px}

.dog-scene{
  position:relative;width:100%;max-width:240px;
  margin:0 auto 16px;padding-top:8px;
  display:flex;align-items:center;justify-content:center;
}
.dog-illust-frame{
  width:188px;height:188px;border-radius:50%;
  overflow:hidden;background:var(--cream);
  border:2.5px solid var(--brown-soft);
  box-shadow:0 4px 12px rgba(74,64,53,.08);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.dog-illust{
  width:92%;height:92%;object-fit:contain;
  transition:transform .3s ease;
}
.timer-hero.working .dog-illust-frame{
  animation:dogWork 2.4s ease-in-out infinite;
}
@keyframes dogWork{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-3px) rotate(-1deg)}
}
.dog-paw-float{
  position:absolute;animation:float 3s ease-in-out infinite;z-index:1;
}
.dog-paw-float.p1{top:0;left:4px;animation-delay:0s}
.dog-paw-float.p2{top:24px;right:0;animation-delay:1s}
.dog-paw-float .paw-img{opacity:.55}
.dog-paw-float.p3{top:2px;right:36px;animation-delay:2s;font-size:14px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.btn-main{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:16px 48px;border-radius:999px;border:none;
  font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
  position:relative;z-index:2;margin-top:4px;flex-shrink:0;
}
.btn-main:active{transform:scale(.96)}
.btn-start{
  background:linear-gradient(135deg,var(--yellow) 0%,#F0C96E 100%);
  color:var(--ink);box-shadow:0 4px 0 #D4B56A;
  min-width:200px;
}
.btn-stop{
  background:linear-gradient(135deg,var(--pink) 0%,#DFA0A4 100%);
  color:var(--ink);box-shadow:0 4px 0 #C89094;
  min-width:200px;
}
.btn-play-icon{
  width:0;height:0;border-style:solid;
  border-width:8px 0 8px 14px;border-color:transparent transparent transparent var(--ink);
  margin-left:4px;
}

.today-mini{
  margin:0 16px;padding:16px 18px;
  background:var(--card);border-radius:var(--radius);
  border:2px solid var(--sage-light);
  display:flex;align-items:center;gap:14px;
}
.today-mini-paw{flex-shrink:0;width:36px;height:36px;
  background:var(--yellow-soft);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--brown-soft);
}
.today-mini-paw .paw-img{width:22px;height:22px}
.today-mini-info{flex:1}
.today-mini-label{font-size:11px;color:var(--ink-light);font-weight:700}
.today-mini-val{font-size:18px;font-weight:800;color:var(--sage);margin-top:2px}

/* ===== RECORDS ===== */
.rec-header{padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.rec-title{font-size:22px;font-weight:800}
.view-tabs{
  display:flex;background:var(--brown-pale);border-radius:12px;padding:3px;gap:2px;
}
.view-tab{
  width:36px;height:32px;border:none;background:transparent;border-radius:10px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--ink-light);transition:all .2s;
}
.view-tab.active{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.view-tab svg{width:18px;height:18px}

.rec-filter{
  margin:0 16px 12px;padding:12px 16px;
  background:var(--card);border-radius:16px;border:2px solid var(--brown-soft);
  display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;
}
.rec-filter .dot{width:10px;height:10px;border-radius:50%;background:var(--yellow)}

/* calendar */
.cal-card{
  margin:0 16px 14px;padding:18px 16px;
  background:var(--card);border-radius:var(--radius);border:2px solid var(--brown-soft);
}
.cal-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px}
.cal-nav button{
  width:32px;height:32px;border:none;background:var(--brown-pale);border-radius:50%;
  font-size:16px;cursor:pointer;color:var(--brown);font-family:inherit;
  display:flex;align-items:center;justify-content:center;
}
.cal-nav button:active{background:var(--brown-soft)}
.cal-month{font-size:15px;font-weight:800;letter-spacing:.08em;min-width:100px;text-align:center}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.cal-wd{text-align:center;font-size:11px;color:var(--ink-light);font-weight:700;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  position:relative;cursor:pointer;border-radius:50%;
  font-size:13px;font-weight:600;color:var(--ink-soft);
}
.cal-day.empty{cursor:default}
.cal-day.today{font-weight:800;color:var(--ink)}
.cal-day.selected:not(.has-work)::after{
  content:'';position:absolute;inset:2px;border:2px solid var(--brown);border-radius:50%;pointer-events:none;
}
.cal-day.has-work .stamp{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
}
.cal-day.has-work .stamp-bg{
  width:90%;height:90%;border-radius:50%;background:var(--yellow);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 2px rgba(166,123,91,.18);
}
.cal-day.has-work.selected .stamp-bg{
  box-shadow:0 0 0 2px var(--brown),0 1px 2px rgba(166,123,91,.18);
}
.cal-day.has-work .stamp-bg .paw-stamp-img{
  width:58%;height:58%;
}
.cal-day.has-work{font-size:0}

.paw-img{
  display:block;flex-shrink:0;object-fit:contain;
  mix-blend-mode:multiply;
}

/* summary cards */
.sec-label{
  padding:0 20px;margin:6px 0 8px;font-size:13px;font-weight:800;color:var(--ink-soft);
  display:flex;align-items:center;gap:8px;
}
.sec-label .ribbon-deco{width:16px;height:16px;flex-shrink:0}
.sec-label .paw-img{width:16px;height:16px;flex-shrink:0}
.summary-card{
  margin:0 16px 14px;padding:16px 18px;
  background:var(--card);border-radius:var(--radius);border:2px solid var(--brown-soft);
}
.summary-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1.5px dashed var(--brown-pale);
  font-size:14px;
}
.summary-row:last-child{border-bottom:none;padding-bottom:0}
.summary-row:first-child{padding-top:0}
.summary-key{color:var(--ink-soft);font-weight:500}
.summary-val{font-weight:800;color:var(--ink)}

/* week timeline */
.week-card{
  margin:0 16px 14px;padding:16px;
  background:var(--card);border-radius:var(--radius);border:2px solid var(--brown-soft);
  overflow:hidden;
}
.week-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px;text-align:center}
.week-day-name{font-size:10px;color:var(--ink-light);font-weight:700}
.week-day-num{
  font-size:13px;font-weight:700;margin-top:4px;
  width:32px;height:32px;margin:0 auto;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  cursor:pointer;
}
.week-day-num.today{background:var(--yellow);color:var(--ink)}
.week-day-num.selected{outline:2px solid var(--brown)}
.week-day-wrap{display:flex;flex-direction:column;align-items:center}
.week-mini-stamp{
  width:18px;height:18px;margin-top:3px;
  background:var(--yellow);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 2px rgba(166,123,91,.18);
}
.week-mini-stamp .paw-img{width:11px;height:11px}
.week-timeline{
  position:relative;height:200px;border:1.5px solid var(--brown-pale);border-radius:12px;
  display:grid;grid-template-columns:40px 1fr;overflow:hidden;
}
.week-times{
  display:flex;flex-direction:column;justify-content:space-between;
  padding:8px 4px;font-size:9px;color:var(--ink-light);font-weight:600;
  border-right:1.5px solid var(--brown-pale);background:var(--cream);
}
.week-grid-area{position:relative;background:repeating-linear-gradient(
  to bottom,var(--brown-pale) 0,var(--brown-pale) 1px,transparent 1px,transparent 25%
)}
.week-blocks{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr)}
.week-col{position:relative;height:100%}
.work-block{
  position:absolute;left:10%;right:10%;background:var(--yellow);
  border-radius:6px;min-height:8px;opacity:.85;
}

/* chart view */
.chart-card{
  margin:0 16px 14px;padding:18px 16px;
  background:var(--card);border-radius:var(--radius);border:2px solid var(--brown-soft);
}
.chart-bars{
  display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px;
}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart-bar{
  width:100%;max-width:32px;background:var(--yellow);border-radius:8px 8px 4px 4px;
  min-height:4px;transition:height .4s ease;
}
.chart-bar-label{font-size:10px;color:var(--ink-light);font-weight:700}
.chart-bar-val{font-size:9px;color:var(--brown);font-weight:800}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 14px}
.stat-card{
  background:var(--card);border-radius:18px;padding:16px;
  border:2px solid var(--brown-soft);text-align:center;
}
.stat-card.accent-sage{border-color:var(--sage-light);background:var(--sage-pale)}
.stat-card.accent-pink{border-color:var(--pink-light)}
.stat-card.accent-yellow{border-color:var(--yellow-soft);background:var(--yellow-soft)}
.stat-card-icon{font-size:22px;margin-bottom:6px}
.stat-card-num{font-size:22px;font-weight:800;color:var(--brown);line-height:1}
.stat-card-lbl{font-size:10px;color:var(--ink-light);font-weight:700;margin-top:4px}

/* ===== PROFILE ===== */
.profile-hero{
  margin:16px;padding:24px 20px;
  background:linear-gradient(135deg,var(--brown-pale) 0%,var(--card) 100%);
  border-radius:var(--radius);border:2.5px solid var(--brown-soft);
  text-align:center;position:relative;
}
.profile-avatar{
  width:88px;height:88px;margin:0 auto 12px;
  background:var(--card);border-radius:50%;
  border:3px solid var(--brown-soft);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 4px 0 rgba(212,181,106,.25);
}
.profile-avatar img{width:72px;height:72px;object-fit:contain}
.profile-name{font-size:20px;font-weight:800;margin-bottom:4px}
.profile-sub{font-size:12px;color:var(--ink-light);font-weight:500}

.streak-card{
  margin:0 16px 14px;padding:18px;
  background:var(--card);border-radius:var(--radius);border:2px solid var(--pink-light);
  display:flex;align-items:center;gap:16px;
}
.streak-paws{display:flex;gap:6px;align-items:center}
.streak-paws .paw-stamp-mini{
  width:28px;height:28px;background:var(--yellow);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(166,123,91,.2);
}
.streak-paws .paw-stamp-mini .paw-img{width:15px;height:15px}
.stat-card-icon .paw-img{width:28px;height:28px;margin:0 auto}
.streak-info{flex:1}
.streak-num{font-size:28px;font-weight:800;color:var(--pink);line-height:1}
.streak-lbl{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:2px}

.session-list{margin:0 16px}
.session-item{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  background:var(--card);border-radius:16px;margin-bottom:8px;
  border:2px solid var(--brown-pale);
}
.session-time{font-size:13px;font-weight:800;color:var(--brown);flex-shrink:0;min-width:52px}
.session-detail{flex:1;font-size:12px;color:var(--ink-soft);font-weight:500}
.session-dur{font-size:14px;font-weight:800;color:var(--ink)}

/* ===== NAV ===== */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  border-top:1.5px solid var(--brown-pale);
  display:flex;align-items:center;justify-content:space-around;
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 0;border:none;background:none;cursor:pointer;
  color:var(--ink-light);font-family:inherit;transition:color .2s;
}
.nav-btn.active{color:var(--brown)}
.nav-btn svg{width:24px;height:24px}
.nav-btn span{font-size:10px;font-weight:700}

/* toast */
.toast{
  position:fixed;top:calc(var(--safe-top) + 16px);left:50%;transform:translateX(-50%) translateY(-80px);
  background:var(--ink);color:var(--card);padding:12px 24px;border-radius:999px;
  font-size:13px;font-weight:700;z-index:200;opacity:0;
  transition:transform .35s ease,opacity .35s ease;pointer-events:none;
  display:flex;align-items:center;gap:8px;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* confetti paw */
.confetti-paw{
  position:fixed;width:28px;height:28px;pointer-events:none;z-index:300;
  animation:confettiFall 1.2s ease-out forwards;
}
.confetti-paw svg{width:100%;height:100%}
@keyframes confettiFall{
  0%{opacity:1;transform:translateY(0) rotate(0deg) scale(1)}
  100%{opacity:0;transform:translateY(-120px) rotate(20deg) scale(.6)}
}
</style>
</head>
<body>

<!-- TIMER -->
<div class="screen active" id="screen-timer">
  <div class="scroll-body">
    <div class="timer-header">
      <div class="timer-badge"><span class="dot"></span>お仕事タイマー</div>
      <div class="timer-display" id="timerDisplay">00:00:00</div>
      <div class="timer-hint" id="timerHint">ボタンをおして作業をはじめよう</div>
    </div>

    <div class="timer-hero" id="timerHero">
      <div class="dog-scene">
        <div class="dog-paw-float p1" id="floatPaw1"></div>
        <div class="dog-paw-float p2" id="floatPaw2"></div>
        <div class="dog-paw-float p3">🎀</div>
        <div class="dog-illust-frame">
          <img class="dog-illust" src="dog-illust.png" alt="パソコンでお仕事するわんちゃん" width="440" height="440">
        </div>
      </div>
      <button class="btn-main btn-start" id="btnStart" onclick="toggleTimer()">
        <span class="btn-play-icon"></span>はじめる
      </button>
    </div>

    <div class="today-mini">
      <div class="today-mini-paw" id="todayMiniPaw"></div>
      <div class="today-mini-info">
        <div class="today-mini-label">きょうのお仕事</div>
        <div class="today-mini-val" id="todayTotal">0分 · 0回</div>
      </div>
    </div>
  </div>
</div>

<!-- RECORDS -->
<div class="screen" id="screen-records">
  <div class="rec-header">
    <div class="rec-title">記録</div>
    <div class="view-tabs">
      <button class="view-tab active" data-view="calendar" onclick="setRecordView('calendar')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 10h18M8 2v4M16 2v4"/><path d="M9 15l2 2 4-4" stroke-linecap="round"/></svg>
      </button>
      <button class="view-tab" data-view="week" onclick="setRecordView('week')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      </button>
      <button class="view-tab" data-view="chart" onclick="setRecordView('chart')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="12" width="4" height="8" rx="1"/><rect x="10" y="8" width="4" height="12" rx="1"/><rect x="16" y="4" width="4" height="16" rx="1"/></svg>
      </button>
    </div>
  </div>

  <div class="rec-filter"><span class="dot"></span>お仕事</div>

  <div class="scroll-body" id="recordsBody"></div>
</div>

<!-- PROFILE -->
<div class="screen" id="screen-profile">
  <div class="scroll-body">
    <div class="profile-hero">
      <div class="profile-avatar">
        <img src="dog-illust.png" alt="もふぱう" width="144" height="144">
      </div>
      <div class="profile-name">もふぱう</div>
      <div class="profile-sub">がんばった日は肉球スタンプがつくよ</div>
    </div>

    <div class="streak-card">
      <div class="streak-paws" id="streakPaws"></div>
      <div class="streak-info">
        <div class="streak-num" id="streakNum">0日</div>
        <div class="streak-lbl">れんぞくお仕事デー</div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card accent-yellow">
        <div class="stat-card-icon">🎀</div>
        <div class="stat-card-num" id="totalSessions">0</div>
        <div class="stat-card-lbl">ぜんぶの回数</div>
      </div>
      <div class="stat-card accent-sage">
        <div class="stat-card-icon" id="statPawIcon"></div>
        <div class="stat-card-num" id="totalTime">0分</div>
        <div class="stat-card-lbl">ぜんぶの時間</div>
      </div>
      <div class="stat-card accent-pink">
        <div class="stat-card-icon">📅</div>
        <div class="stat-card-num" id="totalDays">0</div>
        <div class="stat-card-lbl">お仕事した日</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon">⏱</div>
        <div class="stat-card-num" id="avgSession">0分</div>
        <div class="stat-card-lbl">へいきん時間</div>
      </div>
    </div>

    <div class="sec-label">
      <svg class="ribbon-deco" viewBox="0 0 16 16"><path d="M8 2 C5 6 2 6 2 10 C2 13 5 14 8 12 C11 14 14 13 14 10 C14 6 11 6 8 2Z" fill="#E8B4B8"/></svg>
      さいきんの記録
    </div>
    <div class="session-list" id="recentSessions"></div>
  </div>
</div>

<!-- NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-screen="timer" onclick="switchScreen('timer')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M12 5V3M16 3h-2"/></svg>
    <span>タイマー</span>
  </button>
  <button class="nav-btn" data-screen="records" onclick="switchScreen('records')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 10h18M9 15l2 2 4-4" stroke-linecap="round"/></svg>
    <span>記録</span>
  </button>
  <button class="nav-btn" data-screen="profile" onclick="switchScreen('profile')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
    <span>わたし</span>
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'mofu-work-sessions';
const ACTIVE_KEY = 'mofu-work-active';

const PAW_SRC = 'paw-mark.png';

function pawImg(size, extraClass = '', extraStyle = '') {
  const cls = `paw-img${extraClass ? ' ' + extraClass : ''}`;
  const style = [];
  if (size) style.push(`width:${size}px`, `height:${size}px`);
  if (extraStyle) style.push(extraStyle);
  const styleAttr = style.length ? ` style="${style.join(';')}"` : '';
  return `<img class="${cls}" src="${PAW_SRC}" alt=""${styleAttr}>`;
}

function pawStampHtml() {
  return `<div class="stamp"><div class="stamp-bg">${pawImg(null, 'paw-stamp-img')}</div></div>`;
}

function pawStampMiniHtml() {
  return `<div class="paw-stamp-mini">${pawImg(null)}</div>`;
}

function pawInline(size = 14) {
  return pawImg(size, '', 'display:inline-block;vertical-align:-2px;margin-right:4px');
}

function injectPawIcons() {
  document.getElementById('floatPaw1').innerHTML = pawImg(18);
  document.getElementById('floatPaw2').innerHTML = pawImg(14);
  document.getElementById('todayMiniPaw').innerHTML = pawImg(22);
  document.getElementById('statPawIcon').innerHTML = pawImg(28);
}

let sessions = [];
let activeStart = null;
let timerInterval = null;
let recordView = 'calendar';
let calYear, calMonth, selectedDate;
let weekStart;

function loadData() {
  try { sessions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { sessions = []; }
  const active = localStorage.getItem(ACTIVE_KEY);
  if (active) {
    activeStart = new Date(active);
    startTimerLoop();
    updateTimerUI(true);
  }
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  selectedDate = dateKey(now);
  weekStart = getWeekStart(now);
}

function saveSessions() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
}

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function parseDate(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function formatDuration(ms) {
  const totalMin = Math.floor(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h > 0) return `${h}時間${m > 0 ? m + '分' : ''}`;
  return `${m}分`;
}

function formatTimer(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return [h, m, sec].map(v => String(v).padStart(2, '0')).join(':');
}

function formatTime(d) {
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function getSessionsForDate(key) {
  return sessions.filter(s => dateKey(new Date(s.start)) === key);
}

function getTotalMs(arr) {
  return arr.reduce((sum, s) => sum + s.durationMs, 0);
}

function getWeekStart(d) {
  const r = new Date(d);
  r.setDate(r.getDate() - r.getDay());
  r.setHours(0, 0, 0, 0);
  return r;
}

function getDaysWithWork() {
  const set = new Set();
  sessions.forEach(s => set.add(dateKey(new Date(s.start))));
  return set;
}

function getStreak() {
  const days = [...getDaysWithWork()].sort().reverse();
  if (!days.length) return 0;
  let streak = 0;
  const today = dateKey(new Date());
  let check = new Date();
  if (!days.includes(today)) {
    check.setDate(check.getDate() - 1);
  }
  while (days.includes(dateKey(check))) {
    streak++;
    check.setDate(check.getDate() - 1);
  }
  return streak;
}

function toggleTimer() {
  if (activeStart) finishWork();
  else startWork();
}

function startWork() {
  activeStart = new Date();
  localStorage.setItem(ACTIVE_KEY, activeStart.toISOString());
  startTimerLoop();
  updateTimerUI(true);
}

function startTimerLoop() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (activeStart) {
      document.getElementById('timerDisplay').textContent = formatTimer(Date.now() - activeStart.getTime());
    }
  }, 1000);
}

function finishWork() {
  if (!activeStart) return;
  const end = new Date();
  const durationMs = end - activeStart;
  if (durationMs < 10000) {
    showToast('10秒いじょうで記録できるよ');
    return;
  }
  sessions.unshift({
    id: Date.now().toString(36),
    start: activeStart.toISOString(),
    end: end.toISOString(),
    durationMs
  });
  saveSessions();
  localStorage.removeItem(ACTIVE_KEY);
  activeStart = null;
  if (timerInterval) clearInterval(timerInterval);
  updateTimerUI(false);
  showToast(`${formatDuration(durationMs)} 記録したよ！`);
  spawnConfetti();
  updateTodayMini();
  if (document.getElementById('screen-records').classList.contains('active')) renderRecords();
}

function updateTimerUI(running) {
  const display = document.getElementById('timerDisplay');
  const hint = document.getElementById('timerHint');
  const hero = document.getElementById('timerHero');
  const btn = document.getElementById('btnStart');

  if (running) {
    display.classList.add('running');
    hint.textContent = 'がんばってるね…！';
    hero.classList.add('working');
    btn.className = 'btn-main btn-stop';
    btn.innerHTML = '🎀 作業終了';
    display.textContent = formatTimer(Date.now() - activeStart.getTime());
  } else {
    display.classList.remove('running');
    display.textContent = '00:00:00';
    hint.textContent = 'ボタンをおして作業をはじめよう';
    hero.classList.remove('working');
    btn.className = 'btn-main btn-start';
    btn.innerHTML = '<span class="btn-play-icon"></span>はじめる';
  }
}

function updateTodayMini() {
  const today = dateKey(new Date());
  const todaySessions = getSessionsForDate(today);
  const ms = getTotalMs(todaySessions);
  document.getElementById('todayTotal').textContent =
    `${formatDuration(ms)} · ${todaySessions.length}回`;
}

function switchScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.screen === name);
  });
  if (name === 'records') renderRecords();
  if (name === 'profile') renderProfile();
}

function setRecordView(view) {
  recordView = view;
  document.querySelectorAll('.view-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === view);
  });
  renderRecords();
}

function renderRecords() {
  const body = document.getElementById('recordsBody');
  if (recordView === 'calendar') body.innerHTML = renderCalendarView();
  else if (recordView === 'week') body.innerHTML = renderWeekView();
  else body.innerHTML = renderChartView();
}

function renderCalendarView() {
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const workDays = getDaysWithWork();
  const todayKey = dateKey(new Date());
  const weekdays = ['日','月','火','水','木','金','土'];

  let cells = '';
  for (let i = 0; i < firstDay; i++) cells += '<div class="cal-day empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasWork = workDays.has(key);
    const isToday = key === todayKey;
    const isSelected = key === selectedDate;
    let cls = 'cal-day';
    if (hasWork) cls += ' has-work';
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';
    const content = hasWork ? pawStampHtml() : d;
    cells += `<div class="${cls}" onclick="selectDate('${key}')">${content}</div>`;
  }

  const selSessions = getSessionsForDate(selectedDate);
  const selMs = getTotalMs(selSessions);
  const [sy, sm, sd] = selectedDate.split('-');
  const monthSessions = sessions.filter(s => {
    const d = new Date(s.start);
    return d.getFullYear() === calYear && d.getMonth() === calMonth;
  });
  const monthMs = getTotalMs(monthSessions);
  const monthDays = new Set(monthSessions.map(s => dateKey(new Date(s.start)))).size;

  return `
    <div class="cal-card">
      <div class="cal-nav">
        <button onclick="changeMonth(-1)">‹</button>
        <div class="cal-month">${calYear} / ${String(calMonth+1).padStart(2,'0')}</div>
        <button onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-weekdays">${weekdays.map(w => `<div class="cal-wd">${w}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>
    <div class="sec-label">
      <svg class="ribbon-deco" viewBox="0 0 16 16"><path d="M8 2 C5 6 2 6 2 10 C2 13 5 14 8 12 C11 14 14 13 14 10 C14 6 11 6 8 2Z" fill="#E8B4B8"/></svg>
      ${sm} / ${sd}
    </div>
    <div class="summary-card">
      <div class="summary-row"><span class="summary-key">お仕事した回数</span><span class="summary-val">${selSessions.length}回</span></div>
      <div class="summary-row"><span class="summary-key">お仕事時間</span><span class="summary-val">${formatDuration(selMs)}</span></div>
    </div>
    <div class="sec-label">${pawImg(16)} 月間サマリー</div>
    <div class="summary-card">
      <div class="summary-row"><span class="summary-key">月のお仕事回数</span><span class="summary-val">${monthSessions.length}回</span></div>
      <div class="summary-row"><span class="summary-key">月のお仕事時間</span><span class="summary-val">${formatDuration(monthMs)}</span></div>
      <div class="summary-row"><span class="summary-key">お仕事した日数</span><span class="summary-val">${monthDays}日</span></div>
    </div>`;
}

function renderWeekView() {
  const weekdays = ['日','月','火','水','木','金','土'];
  const todayKey = dateKey(new Date());
  const weekDays = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    weekDays.push(d);
  }

  const dayHeaders = weekDays.map(d => {
    const key = dateKey(d);
    const hasWork = getSessionsForDate(key).length > 0;
    const isToday = key === todayKey;
    const isSelected = key === selectedDate;
    let cls = 'week-day-num';
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';
    const stamp = hasWork ? `<div class="week-mini-stamp">${pawImg(null)}</div>` : '';
    return `<div class="week-day-wrap"><div class="week-day-name">${weekdays[d.getDay()]}</div><div class="${cls}" onclick="selectDate('${key}')">${d.getDate()}</div>${stamp}</div>`;
  }).join('');

  const startHour = 8, endHour = 22;
  const hours = [];
  for (let h = startHour; h <= endHour; h += 2) hours.push(`${h}:00`);

  const blocks = weekDays.map((d, colIdx) => {
    const daySessions = getSessionsForDate(dateKey(d));
    return daySessions.map(s => {
      const start = new Date(s.start);
      const end = new Date(s.end);
      const startMin = (start.getHours() - startHour) * 60 + start.getMinutes();
      const endMin = (end.getHours() - startHour) * 60 + end.getMinutes();
      const totalMin = (endHour - startHour) * 60;
      const top = Math.max(0, (startMin / totalMin) * 100);
      const height = Math.max(4, ((endMin - startMin) / totalMin) * 100);
      return `<div class="work-block" style="top:${top}%;height:${height}%"></div>`;
    }).join('');
  });

  const selSessions = getSessionsForDate(selectedDate);
  const selMs = getTotalMs(selSessions);
  const weekSessions = weekDays.flatMap(d => getSessionsForDate(dateKey(d)));
  const weekMs = getTotalMs(weekSessions);
  const weekWorkDays = weekDays.filter(d => getSessionsForDate(dateKey(d)).length > 0).length;

  return `
    <div class="week-card">
      <div class="cal-nav" style="margin-bottom:12px">
        <button onclick="changeWeek(-1)">‹</button>
        <div class="cal-month">${weekDays[0].getMonth()+1}.${weekDays[0].getDate()} – ${weekDays[6].getMonth()+1}.${weekDays[6].getDate()}</div>
        <button onclick="changeWeek(1)">›</button>
      </div>
      <div class="week-days">${dayHeaders}</div>
      <div class="week-timeline">
        <div class="week-times">${hours.map(h => `<span>${h}</span>`).join('')}</div>
        <div class="week-grid-area">
          <div class="week-blocks">${blocks.map(b => `<div class="week-col">${b}</div>`).join('')}</div>
        </div>
      </div>
    </div>
    <div class="sec-label">週間サマリー</div>
    <div class="summary-card">
      <div class="summary-row"><span class="summary-key">週のお仕事回数</span><span class="summary-val">${weekSessions.length}回</span></div>
      <div class="summary-row"><span class="summary-key">週のお仕事時間</span><span class="summary-val">${formatDuration(weekMs)}</span></div>
      <div class="summary-row"><span class="summary-key">お仕事した日数</span><span class="summary-val">${weekWorkDays} / 7</span></div>
      <div class="summary-row"><span class="summary-key">日平均お仕事時間</span><span class="summary-val">${formatDuration(weekMs / 7)}</span></div>
    </div>
    <div class="sec-label">
      <svg class="ribbon-deco" viewBox="0 0 16 16"><path d="M8 2 C5 6 2 6 2 10 C2 13 5 14 8 12 C11 14 14 13 14 10 C14 6 11 6 8 2Z" fill="#E8B4B8"/></svg>
      選択日：${formatDuration(selMs)} · ${selSessions.length}回
    </div>`;
}

function renderChartView() {
  const weekDays = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    weekDays.push(d);
  }
  const weekdays = ['日','月','火','水','木','金','土'];
  const maxMs = Math.max(...weekDays.map(d => getTotalMs(getSessionsForDate(dateKey(d)))), 1);

  const bars = weekDays.map(d => {
    const ms = getTotalMs(getSessionsForDate(dateKey(d)));
    const pct = (ms / maxMs) * 100;
    const min = Math.floor(ms / 60000);
    return `<div class="chart-bar-wrap">
      <div class="chart-bar-val">${min > 0 ? min + '分' : ''}</div>
      <div class="chart-bar" style="height:${Math.max(4, pct)}%"></div>
      <div class="chart-bar-label">${weekdays[d.getDay()]}</div>
    </div>`;
  }).join('');

  const weekSessions = weekDays.flatMap(d => getSessionsForDate(dateKey(d)));
  const weekMs = getTotalMs(weekSessions);
  const weekWorkDays = weekDays.filter(d => getSessionsForDate(dateKey(d)).length > 0).length;
  const avgSession = weekSessions.length ? weekMs / weekSessions.length : 0;

  const selSessions = getSessionsForDate(selectedDate);
  const selMs = getTotalMs(selSessions);
  const [sy, sm, sd] = selectedDate.split('-');

  return `
    <div class="chart-card">
      <div class="cal-nav" style="margin-bottom:16px">
        <button onclick="changeWeek(-1)">‹</button>
        <div class="cal-month">週間グラフ</div>
        <button onclick="changeWeek(1)">›</button>
      </div>
      <div class="chart-bars">${bars}</div>
    </div>
    <div class="sec-label">${sm} / ${sd}</div>
    <div class="summary-card">
      <div class="summary-row"><span class="summary-key">お仕事した回数</span><span class="summary-val">${selSessions.length}回</span></div>
      <div class="summary-row"><span class="summary-key">お仕事時間</span><span class="summary-val">${formatDuration(selMs)}</span></div>
    </div>
    <div class="sec-label">🎀 週間サマリー</div>
    <div class="summary-card">
      <div class="summary-row"><span class="summary-key">お仕事した回数</span><span class="summary-val">${weekSessions.length}回</span></div>
      <div class="summary-row"><span class="summary-key">お仕事時間</span><span class="summary-val">${formatDuration(weekMs)}</span></div>
      <div class="summary-row"><span class="summary-key">お仕事した日数</span><span class="summary-val">${weekWorkDays} / 7</span></div>
      <div class="summary-row"><span class="summary-key">平均お仕事時間</span><span class="summary-val">${formatDuration(avgSession)}</span></div>
      <div class="summary-row"><span class="summary-key">日平均お仕事時間</span><span class="summary-val">${formatDuration(weekMs / 7)}</span></div>
    </div>`;
}

function renderProfile() {
  const streak = getStreak();
  document.getElementById('streakNum').textContent = streak + '日';
  const pawCount = Math.min(Math.max(streak, 1), 5);
  document.getElementById('streakPaws').innerHTML = Array(pawCount).fill(pawStampMiniHtml()).join('');

  document.getElementById('totalSessions').textContent = sessions.length + '回';
  document.getElementById('totalTime').textContent = formatDuration(getTotalMs(sessions));
  document.getElementById('totalDays').textContent = getDaysWithWork().size + '日';
  const avg = sessions.length ? getTotalMs(sessions) / sessions.length : 0;
  document.getElementById('avgSession').textContent = formatDuration(avg);

  const recent = sessions.slice(0, 10);
  const list = document.getElementById('recentSessions');
  if (!recent.length) {
    list.innerHTML = `<div style="text-align:center;padding:24px;color:var(--ink-light);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px">
      ${pawImg(36, '', 'opacity:.4')}まだ記録がないよ</div>`;
    return;
  }
  list.innerHTML = recent.map(s => {
    const start = new Date(s.start);
    const key = dateKey(start);
    const [y, m, d] = key.split('-');
    return `<div class="session-item">
      <div class="session-time">${formatTime(start)}</div>
      <div class="session-detail">${m}/${d}</div>
      <div class="session-dur">${pawInline()}${formatDuration(s.durationMs)}</div>
    </div>`;
  }).join('');
}

function selectDate(key) {
  selectedDate = key;
  const d = parseDate(key);
  calYear = d.getFullYear();
  calMonth = d.getMonth();
  weekStart = getWeekStart(d);
  renderRecords();
}

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderRecords();
}

function changeWeek(delta) {
  weekStart.setDate(weekStart.getDate() + delta * 7);
  renderRecords();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function spawnConfetti() {
  const items = [pawImg(24), '🎀', '✨', pawImg(20)];
  for (let i = 0; i < 8; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-paw';
    const item = items[i % items.length];
    el.innerHTML = item.startsWith('<') ? item : `<span style="font-size:22px">${item}</span>`;
    el.style.left = (20 + Math.random() * 60) + '%';
    el.style.top = (40 + Math.random() * 20) + '%';
    el.style.animationDelay = (i * 0.08) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1500);
  }
}

loadData();
injectPawIcons();
updateTodayMini();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
